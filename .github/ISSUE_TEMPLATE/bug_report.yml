name: Bug report
description: Report a reproducible problem with PluralCraft.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove tokens, private system information, and unrelated personal details from logs and screenshots before posting.
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: PluralCraft currently targets Minecraft 26.3.
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: fabric-loader
    attributes:
      label: Fabric Loader version
      placeholder: "For example: 0.20.1"
    validations:
      required: true
  - type: input
    id: fabric-api
    attributes:
      label: Fabric API version
      placeholder: "For example: 0.166.2+26.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem without sharing private system or account details.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a server with...
        2. Connect using...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Include only the relevant excerpt. Redact tokens, personal information, and private system details.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked my report and attachments for access tokens and private information.
          required: true
