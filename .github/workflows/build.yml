name: Build

on:
  push: # every commit pushed to any branch or tag
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build with Gradle
        run: sh ./gradlew build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pluralcraft-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          # Uses the repository's artifact retention setting (90 days by default).
